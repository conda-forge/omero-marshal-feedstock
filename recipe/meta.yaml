{% set name = "omero-marshal" %}
{% set version = "0.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/omero_marshal-{{ version }}.tar.gz
  sha256: 6aff867b6854da26477c465d01465a0466959aa6a4ffc58563e7e8cbb77e44ac

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - omero-py
    - python >={{ python_min }}

test:
  imports:
    - omero_marshal
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ome/omero-marshal
  summary: OMERO Marshal
  license: GPL-2.0
  license_file: license.md

extra:
  recipe-maintainers:
    - joshmoore
    - marimeireles
